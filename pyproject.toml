[project]
name = "nl2sql-agent"
version = "1.0.0"
description = "NL-to-SQL LangGraph agent for e-commerce PostgreSQL database"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=0.1",
    "langchain-groq>=0.3.8",
    "langchain-core>=0.3",
    "asyncpg>=0.30",
    "sqlglot>=26.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langfuse>=3.8",
    "structlog>=24.0",
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
nl2sql = "nl2sql.api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
