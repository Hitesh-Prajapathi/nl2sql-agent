name: Eval smoke
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src/nl2sql/agent/**"
      - "src/nl2sql/llm/**"
      - "src/nl2sql/schema/**"
      - "src/nl2sql/safety/**"
  workflow_dispatch:
concurrency:
  group: eval-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    # Path filter above handles the path trigger; the "labeled" action only runs for the "eval" label.
    # Never runs for fork PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' || github.event.label.name == 'eval'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY not available; skipping eval smoke."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen --extra dev
      - name: Set up BIRD data
        if: steps.gate.outputs.run == 'true'
        # Downloads BIRD Mini-Dev and loads it into the bird_minidev database (uses psql on the runner).
        run: make bird-setup
      - name: Run eval on fixed subset
        if: steps.gate.outputs.run == 'true'
        # Writes results/bird_minidev_full_small-n25_<date>.json (label includes the question count).
        run: |
          ids=$(grep -v '^#' .github/eval_smoke_ids.txt | grep -E '^[0-9]+$' | paste -sd, -)
          make eval VARIANT=full_small IDS="$ids" EVAL_ARGS="--fresh"
      - name: Gate on baseline
        if: steps.gate.outputs.run == 'true'
        # Counts records with ex == 1 (summary.ex is a percentage, not a count).
        run: |
          baseline=$(grep -v '^#' .github/eval_smoke_baseline.txt | grep -E '^[0-9]+$' | head -1)
          python3 - "$baseline" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, sys
          baseline = int(sys.argv[1])
          files = sorted(glob.glob("results/bird_minidev_full_small-n25_*.json"))
          if not files:
              sys.exit("no results JSON found")
          res = json.load(open(files[-1]))
          s = res["summary"]
          correct = sum(1 for r in res["records"] if r.get("ex") in (1, True))
          print(f"correct={correct} n_scored={s['n_scored']}/{s['n_total']} infra_errors={s['n_infra_error']} baseline={baseline}")
          if s["n_scored"] == 0:
              sys.exit("no questions were scored (infra errors / rate limit?)")
          if correct < baseline - 2:
              sys.exit(f"Below baseline - 2 ({correct} < {baseline - 2})")
          PY
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: eval-smoke-results
          path: results/
          if-no-files-found: ignore
